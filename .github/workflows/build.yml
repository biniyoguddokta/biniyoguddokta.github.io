
name: Build APK

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true

      - name: Verify Android project files
        run: |
          echo "========== ANDROID FILE CHECK =========="

          for file in \
            android/settings.gradle \
            android/build.gradle \
            android/gradle.properties \
            android/app/build.gradle \
            android/gradle/wrapper/gradle-wrapper.properties \
            android/gradle/wrapper/gradle-wrapper.jar \
            android/gradlew
          do
            if [ -f "$file" ]; then
              echo "FOUND: $file"
            else
              echo "MISSING: $file"
            fi
          done

          echo "========== GRADLE WRAPPER PERMISSION =========="
          ls -l android/gradlew || true

          echo "========== ANDROID FOLDER CONTENTS =========="
          find android -maxdepth 4 -type f | sort

      - name: Verify branch and Gradle configuration
        run: |
          echo "========== CURRENT BRANCH =========="
          git branch --show-current

          echo "========== LATEST COMMIT =========="
          git log -1 --oneline

          echo "========== CURRENT DIRECTORY =========="
          pwd

          echo "========== GRADLE WRAPPER SCRIPT =========="
          readlink -f android/gradlew || true
          ls -l android/gradlew || true

          echo "========== GRADLE WRAPPER FILES =========="
          ls -l android/gradle/wrapper/ || true

          echo "========== ALL WRAPPER CONFIGURATIONS =========="
          find . -name gradle-wrapper.properties -print

          echo "========== WRAPPER SCRIPT CONFIGURATION =========="
          grep -nE 'APP_HOME|CLASSPATH|gradle-wrapper' android/gradlew || true

          echo "========== GRADLE WRAPPER PROPERTIES =========="
          cat android/gradle/wrapper/gradle-wrapper.properties

          echo "========== GRADLE WRAPPER JAR CHECKSUM =========="
          sha256sum android/gradle/wrapper/gradle-wrapper.jar

          echo "========== ACTUAL GRADLE VERSION =========="
          cd android
          ./gradlew --version

      - name: Verify release package
        run: python3 tool/verify_release.py

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test --no-pub

      - name: Generate app icons
        run: dart run flutter_launcher_icons

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
