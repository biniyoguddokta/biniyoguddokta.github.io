
name: Build APK

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Java
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'

      # 3. Set up Flutter
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true

      # 4. Verify required Android files
      - name: Verify Android project files
        run: |
          test -f android/settings.gradle
          test -f android/build.gradle
          test -f android/gradle.properties
          test -f android/app/build.gradle
          test -f android/gradle/wrapper/gradle-wrapper.properties
          test -f android/gradle/wrapper/gradle-wrapper.jar
          test -f android/gradlew

      # 5. Diagnose branch and Gradle configuration
      - name: Verify branch and Gradle configuration
        run: |
          echo "========== CURRENT BRANCH =========="
          git branch --show-current

          echo "========== LATEST COMMIT =========="
          git log -1 --oneline

          echo "========== CURRENT DIRECTORY =========="
          pwd

          echo "========== GRADLE WRAPPER SCRIPT =========="
          readlink -f android/gradlew
          ls -l android/gradlew

          echo "========== GRADLE WRAPPER FILES =========="
          ls -l android/gradle/wrapper/

          echo "========== ALL WRAPPER CONFIGURATIONS =========="
          find . -name gradle-wrapper.properties -print

          echo "========== WRAPPER SCRIPT CONFIGURATION =========="
          grep -nE 'APP_HOME|CLASSPATH|gradle-wrapper' android/gradlew

          echo "========== GRADLE WRAPPER PROPERTIES =========="
          cat android/gradle/wrapper/gradle-wrapper.properties

          echo "========== GRADLE WRAPPER JAR CHECKSUM =========="
          sha256sum android/gradle/wrapper/gradle-wrapper.jar

          echo "========== ACTUAL GRADLE VERSION =========="
          cd android
          ./gradlew --version

      # 6. Verify release package
      - name: Verify release package
        run: python3 tool/verify_release.py

      # 7. Install dependencies
      - name: Install dependencies
        run: flutter pub get

      # 8. Run tests
      - name: Run tests
        run: flutter test --no-pub

      # 9. Generate app icons
      - name: Generate app icons
        run: dart run flutter_launcher_icons

      # 10. Build release APK
      - name: Build release APK
        run: flutter build apk --release

      # 11. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
